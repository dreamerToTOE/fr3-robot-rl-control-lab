# RL04 PPO seed=42 配置
# 环境: Pendulum-v1 (Gymnasium)
algo: ppo
env_id: Pendulum-v1
seed: 42
total_timesteps: 50000

policy: MlpPolicy
net_arch: [64, 64]

learning_rate: 3.0e-4
gamma: 0.99
n_steps: 2048
batch_size: 64
n_epochs: 10
clip_range: 0.2
gae_lambda: 0.95
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

# 结果与 checkpoint
checkpoint_freq: 10000
eval_episodes: 20
eval_seed_base: 1000
