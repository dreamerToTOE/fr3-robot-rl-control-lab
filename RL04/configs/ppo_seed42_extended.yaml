# RL04 PPO seed=42 —— 扩展预算实验（诊断修复尝试）
#
# 背景：第一轮 prescribed 50k 步 PPO 未学会 Pendulum（评估 return ≈ random）。
# 诊断：算法配置与第一轮一致，仅放大训练预算，用于隔离"预算不足"这一根因。
# 该实验独立于第一轮 ppo_seed42，不覆盖其结果。
algo: ppo
env_id: Pendulum-v1
seed: 42
total_timesteps: 300000

policy: MlpPolicy
net_arch: [64, 64]

learning_rate: 3.0e-4
gamma: 0.99
n_steps: 2048
batch_size: 64
n_epochs: 10
clip_range: 0.2
gae_lambda: 0.95
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5

checkpoint_freq: 50000
eval_episodes: 20
eval_seed_base: 1000
