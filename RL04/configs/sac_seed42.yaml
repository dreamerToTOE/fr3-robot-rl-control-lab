# RL04 SAC seed=42 配置
# 环境: Pendulum-v1 (Gymnasium)
algo: sac
env_id: Pendulum-v1
seed: 42
total_timesteps: 50000

policy: MlpPolicy
net_arch: [64, 64]

learning_rate: 3.0e-4
gamma: 0.99
batch_size: 256
buffer_size: 100000
tau: 0.005
train_freq: 1
gradient_steps: 1
learning_starts: 100
ent_coef: auto

# 结果与 checkpoint
checkpoint_freq: 10000
eval_episodes: 20
eval_seed_base: 1000
